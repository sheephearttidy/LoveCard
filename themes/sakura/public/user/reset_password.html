{% extends "base.html" %}
{% block title %}重置密码 - {{ site_config.siteName }}{% endblock %}
{% block content %}
<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px">
    <div style="width:100%;max-width:420px">
        <div class="page-card">
            <div style="text-align:center;margin-bottom:28px">
                <div style="width:48px;height:48px;background:var(--violet-soft);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--violet);font-size:1.2rem;margin-bottom:12px"><i class="fas fa-lock-open"></i></div>
                <h1 style="font-size:1.4rem;font-weight:800;margin-bottom:4px">重置密码</h1>
                <p style="color:var(--text-muted);font-size:0.85rem">请输入你的新密码</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="flash-msg {% if category == 'error' %}error{% else %}success{% endif %}">{{ message }}</div>
            {% endfor %}
            {% endwith %}
            <form method="POST" action="/reset_password/{{ token }}">
                <div class="field">
                    <label class="field-label">新密码</label>
                    <input type="password" name="new_password" required minlength="6" placeholder="至少 6 位" class="field-input">
                </div>
                <div class="field">
                    <label class="field-label">确认密码</label>
                    <input type="password" name="confirm_password" required minlength="6" placeholder="再次输入新密码" class="field-input">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;padding:12px">重置密码</button>
            </form>
            <div style="text-align:center;margin-top:16px">
                <a href="/login" style="color:var(--violet);font-size:0.85rem;font-weight:500"><i class="fas fa-arrow-left"></i> 返回登录</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
