{% extends "base.html" %}

{% block title %}重置密码 - {{ site_config.siteName }}{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-8">
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-primary-100 dark:bg-primary-900/30 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-lock-open text-primary-500 text-xl"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-900 dark:text-white">重置密码</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">请输入你的新密码</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="mb-4 p-3 rounded-lg text-sm {{ 'bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400' if category == 'error' else 'bg-green-50 dark:bg-green-900/20 text-green-600 dark:text-green-400' }}">
                {{ message }}
            </div>
            {% endfor %}
            {% endwith %}

            <form method="POST" action="/reset_password/{{ token }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">新密码</label>
                    <input type="password" name="new_password" required minlength="6"
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition"
                        placeholder="至少 6 位">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">确认密码</label>
                    <input type="password" name="confirm_password" required minlength="6"
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-200 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition"
                        placeholder="再次输入新密码">
                </div>
                <button type="submit"
                    class="w-full py-2.5 rounded-lg bg-primary-500 hover:bg-primary-600 text-white font-medium transition">
                    重置密码
                </button>
            </form>

            <div class="mt-4 text-center text-sm">
                <a href="/login" class="text-primary-500 hover:text-primary-700 transition">
                    <i class="fas fa-arrow-left mr-1"></i>返回登录
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
