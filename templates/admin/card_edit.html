{% extends "admin/base.html" %}

{% block title %}编辑卡片 #{{ card.id }}{% endblock %}
{% block page_title %}编辑卡片{% endblock %}

{% block content %}
<div class="mb-3 flex items-center text-xs text-gray-500 dark:text-gray-400">
    <a href="/admin/cards" class="hover:text-primary-500 transition">
        <i class="fas fa-arrow-left mr-1"></i>卡片管理
    </a>
    <i class="fas fa-chevron-right mx-1.5 text-[10px]"></i>
    <a href="/admin/cards/{{ card.id }}/detail" class="hover:text-primary-500 transition">卡片 #{{ card.id }}</a>
    <i class="fas fa-chevron-right mx-1.5 text-[10px]"></i>
    <span class="text-gray-700 dark:text-gray-300">编辑</span>
</div>

<div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700/50 p-5">
    <form method="post" action="/admin/cards/{{ card.id }}/edit">
        <div class="mb-4">
            <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">表白对象</label>
            <input type="text" name="target" value="{{ (card.data or {}).get('target', '') }}" placeholder="表白对象（选填）"
                   class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-600 rounded-lg text-xs bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-pink-400">
        </div>

        <div class="mb-4">
            <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">卡片内容 <span class="text-red-500">*</span></label>
            <textarea name="content" rows="10" required
                      class="w-full px-3 py-2 border border-gray-200 dark:border-gray-600 rounded-lg text-sm bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-primary-500 resize-y font-mono">{{ card.content or '' }}</textarea>
        </div>

        <div class="mb-4">
            <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">封面图 URL</label>
            <input type="text" name="cover" value="{{ card.cover or '' }}" placeholder="封面图URL（可选）"
                   class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-600 rounded-lg text-xs bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-primary-500">
        </div>

        <div class="mb-5">
            <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">标签 <span class="text-gray-400 text-[11px]">(逗号分隔)</span></label>
            <input type="text" name="tags" value="{{ card_tag_names | join(',') }}" placeholder="标签1,标签2,标签3"
                   class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-600 rounded-lg text-xs bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-primary-500">
            {% if all_tags %}
            <div class="flex flex-wrap gap-1 mt-2">
                {% for tag in all_tags %}
                <button type="button" onclick="addTag('{{ tag.name }}')" class="px-2 py-0.5 bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 rounded text-[11px] hover:opacity-80 transition">
                    <i class="fas fa-tag mr-0.5"></i>{{ tag.name }}
                </button>
                {% endfor %}
            </div>
            {% endif %}
        </div>

        <div class="flex items-center gap-2">
            <button type="submit" class="px-4 py-1.5 bg-primary-500 text-white rounded-lg text-xs font-medium hover:bg-primary-600 transition">
                <i class="fas fa-save mr-1.5"></i>保存修改
            </button>
            <a href="/admin/cards/{{ card.id }}/detail" class="px-4 py-1.5 border border-gray-200 dark:border-gray-600 rounded-lg text-xs text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                取消
            </a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
function addTag(name) {
    var input = document.querySelector('input[name="tags"]');
    var current = input.value.trim();
    if (current) {
        var tags = current.split(',').map(function(t){return t.trim()}).filter(function(t){return t});
        if (tags.indexOf(name) === -1) {
            tags.push(name);
        }
        input.value = tags.join(',');
    } else {
        input.value = name;
    }
}
</script>
{% endblock %}
