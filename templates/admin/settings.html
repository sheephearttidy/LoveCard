{% extends "admin/base.html" %}

{% block title %}系统配置{% endblock %}
{% block page_title %}系统配置{% endblock %}

{% block content %}
<div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700">
    <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700">
        <h2 class="font-semibold text-gray-800 dark:text-white"><i class="fas fa-gear text-gray-400 dark:text-gray-500 mr-2"></i>系统配置</h2>
    </div>

    <form method="post" action="/admin/settings">
        <div class="divide-y divide-gray-50 dark:divide-gray-700">
            {% for config in configs %}
            <div class="px-6 py-4 flex items-center gap-4 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition">
                <div class="w-40 flex-shrink-0">
                    <label class="text-sm font-medium text-gray-700 dark:text-gray-300" for="config-{{ config.name }}">
                        {{ config.name }}
                    </label>
                </div>
                <div class="flex-1">
                    {% if config.name in ['siteDesc', 'smtpSecure'] or config.value|length < 100 %}
                    <input type="text" id="config-{{ config.name }}" name="{{ config.name }}"
                           value="{{ config.value }}"
                           class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200">
                    {% else %}
                    <textarea id="config-{{ config.name }}" name="{{ config.name }}" rows="2"
                              class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition resize-none bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200">{{ config.value }}</textarea>
                    {% endif %}
                </div>
            </div>
            {% endfor %}
        </div>

        <div class="px-6 py-4 border-t border-gray-100 dark:border-gray-700 flex justify-end">
            <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-blue-600 transition">
                <i class="fas fa-save mr-1"></i>保存配置
            </button>
        </div>
    </form>
</div>
{% endblock %}
