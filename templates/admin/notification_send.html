{% extends "admin/base.html" %}

{% block title %}发送通知{% endblock %}
{% block page_title %}发送通知{% endblock %}

{% block content %}
<div class="mb-3 flex items-center text-xs text-gray-500 dark:text-gray-400">
    <a href="/admin/notifications" class="hover:text-primary-500 transition">
        <i class="fas fa-arrow-left mr-1"></i>通知管理
    </a>
    <i class="fas fa-chevron-right mx-1.5 text-[10px]"></i>
    <span class="text-gray-700 dark:text-gray-300">发送通知</span>
</div>

<div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700/50 p-5">
    <form method="post" action="/admin/notifications/send">
        <div class="mb-4">
            <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">发送对象</label>
            <div class="flex items-center gap-3">
                <label class="inline-flex items-center text-xs text-gray-600 dark:text-gray-400">
                    <input type="radio" name="target" value="all" checked class="mr-1.5 text-primary-500 focus:ring-primary-500">
                    所有正常用户
                </label>
                <label class="inline-flex items-center text-xs text-gray-600 dark:text-gray-400">
                    <input type="radio" name="target" value="single" class="mr-1.5 text-primary-500 focus:ring-primary-500">
                    指定用户
                </label>
            </div>
            <input type="number" name="user_id" placeholder="用户ID（选择指定用户时填写）"
                   class="mt-2 w-full px-3 py-1.5 border border-gray-200 dark:border-gray-600 rounded-lg text-xs bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-primary-500">
        </div>

        <div class="mb-4">
            <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">通知类型</label>
            <select name="type" class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-600 rounded-lg text-xs bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-1 focus:ring-primary-500">
                <option value="system">系统通知</option>
                <option value="announcement">公告</option>
                <option value="warning">警告</option>
                <option value="maintenance">维护通知</option>
            </select>
        </div>

        <div class="mb-4">
            <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">通知标题 <span class="text-red-500">*</span></label>
            <input type="text" name="title" required placeholder="输入通知标题"
                   class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-600 rounded-lg text-xs bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-primary-500">
        </div>

        <div class="mb-5">
            <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">通知内容</label>
            <textarea name="content" rows="5" placeholder="输入通知内容..."
                      class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-600 rounded-lg text-xs bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-primary-500 resize-none"></textarea>
        </div>

        <div class="flex items-center gap-2">
            <button type="submit" class="px-4 py-1.5 bg-primary-500 text-white rounded-lg text-xs font-medium hover:bg-primary-600 transition">
                <i class="fas fa-paper-plane mr-1.5"></i>发送通知
            </button>
            <a href="/admin/notifications" class="px-4 py-1.5 border border-gray-200 dark:border-gray-600 rounded-lg text-xs text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                取消
            </a>
        </div>
    </form>
</div>
{% endblock %}
