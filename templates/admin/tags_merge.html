{% extends "admin/base.html" %}

{% block title %}标签合并{% endblock %}
{% block page_title %}标签合并{% endblock %}

{% block content %}
<div class="mb-3 flex items-center text-xs text-gray-500 dark:text-gray-400">
    <a href="/admin/tags" class="hover:text-primary-500 transition">
        <i class="fas fa-arrow-left mr-1"></i>标签管理
    </a>
    <i class="fas fa-chevron-right mx-1.5 text-[10px]"></i>
    <span class="text-gray-700 dark:text-gray-300">标签合并</span>
</div>

<div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700/50 p-5">
    <div class="mb-4 p-3 bg-amber-50 dark:bg-amber-900/15 border border-amber-200/60 dark:border-amber-800/30 rounded-lg">
        <p class="text-xs text-amber-700 dark:text-amber-300">
            <i class="fas fa-triangle-exclamation mr-1.5"></i>
            合并操作会将源标签从所有卡片中替换为目标标签，并删除源标签。此操作不可撤销，请谨慎操作。
        </p>
    </div>

    <form method="post" action="/admin/tags/merge">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
            <div>
                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">源标签 <span class="text-red-500">*</span> <span class="text-gray-400 text-[11px]">(将被删除)</span></label>
                <select name="source_id" required class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-600 rounded-lg text-xs bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-1 focus:ring-primary-500">
                    <option value="">选择源标签...</option>
                    {% for tag in tags %}
                    <option value="{{ tag.id }}">{{ tag.name }} (ID:{{ tag.id }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">目标标签 <span class="text-red-500">*</span> <span class="text-gray-400 text-[11px]">(将保留)</span></label>
                <select name="target_id" required class="w-full px-3 py-1.5 border border-gray-200 dark:border-gray-600 rounded-lg text-xs bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-1 focus:ring-primary-500">
                    <option value="">选择目标标签...</option>
                    {% for tag in tags %}
                    <option value="{{ tag.id }}">{{ tag.name }} (ID:{{ tag.id }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button type="submit" class="px-4 py-1.5 bg-orange-500 text-white rounded-lg text-xs font-medium hover:bg-orange-600 transition" onclick="return confirm('确认合并标签？此操作不可撤销！')">
                <i class="fas fa-code-merge mr-1.5"></i>合并标签
            </button>
            <a href="/admin/tags" class="px-4 py-1.5 border border-gray-200 dark:border-gray-600 rounded-lg text-xs text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                取消
            </a>
        </div>
    </form>
</div>
{% endblock %}
